<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript Console Demo</title>
    <script src="script.js"></script>
</head>
<body>
    <h1>Javascript Console Demo</h1>
    <p>Open the browser console to see the output.</p>

    <script>
        // Example of using console.log
        console.log("Hello, this is a message from the console!");

        // Example of using console.error
        console.error("This is an error message.");

        // Example of using console.warn
        console.warn("This is a warning message.");

        // Example of using console.table
        const users = [
            { name: "Alice", age: 25 },
            { name: "Bob", age: 30 },
            { name: "Charlie", age: 35 }
        ];
        console.table(users);
    </script>
</body>
</html>
