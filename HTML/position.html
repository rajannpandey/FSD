<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Positioning Demo</title>
    <style>
        /* Basic styling for demonstration */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            position: relative;
            width: 100%;
            height: 400px;
            background-color: #f0f0f0;
            border: 1px solid #ccc;
        }
        .box {
            position: absolute;
            width: 100px;
            height: 100px;
            background-color: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .top-left {
            top: 10px;
            left: 10px;
        }
        .top-right {
            top: 10px;
            right: 10px;
        }
        .bottom-left {
            bottom: 10px;
            left: 10px;
        }
        .bottom-right {
            bottom: 10px;
            right: 10px;
        }
       
        </style>
</head>
<body>
    <div class="container">
        <div class="box top-left">Top Left</div>
        <div class="box top-right">Top Right</div>
        <div class="box bottom-left">Bottom Left</div>
        <div class="box bottom-right">Bottom Right</div>
    </div>

</body>
</html>
